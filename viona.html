<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khusus Untuk Viona ❤️</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #ffe6e8;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
            position: relative;
        }
        h1 { color: #e63946; font-size: 24px; margin-bottom: 10px; }
        .nama { color: #ff4d6d; text-decoration: underline; font-weight: bold; }
        p { line-height: 1.6; color: #555; }
        .btn-container {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 15px;
            min-height: 50px;
        }
        button {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        .btn-ya { background-color: #ff4d6d; color: white; }
        .btn-ya:hover { transform: scale(1.05); }
        .btn-ga { background-color: #cccccc; color: #666666; position: absolute; }
        
        #pesan-rahasia {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #fff0f3;
            border-radius: 10px;
            border: 1px dashed #ff4d6d;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Maafin Aku Ya, <span class="nama">Viona</span>? 🥺</h1>
        <p>Aku tahu aku salah dan udah bikin <span class="nama">Viona</span> kesal. Aku beneran menyesal dan nggak mau kamu sedih terus.</p>
        <p><strong>Masih mau maafin aku, kan?</strong></p>

        <div class="btn-container">
            <button class="btn-ya" onclick="maafDiterima()">Mau Maafin ❤️</button>
            <button class="btn-ga" id="btnGa" onmouseover="kabur()" onclick="kabur()">Nggak Mau 😜</button>
        </div>

        <div id="pesan-rahasia">
            <h3>Makasih BANYAK Sayang! 🥰</h3>
            <p>Janji deh habis ini aku bakal lebih peka lagi. Nanti kita jalan dan makan bareng ya, <span class="nama">Viona</span>!</p>
        </div>
    </div>

    <script>
        function maafDiterima() {
            document.getElementById('pesan-rahasia').style.display = 'block';
            document.querySelector('.btn-ya').style.display = 'none';
            document.getElementById('btnGa').style.display = 'none';
        }

        function kabur() {
            const btn = document.getElementById('btnGa');
            const x = Math.random() * (window.innerWidth - btn.offsetWidth - 100);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight - 100);
            
            btn.style.position = 'fixed';
            btn.style.left = x + 'px';
            btn.style.top = y + 'px';
        }
    </script>
</body>
</html>
